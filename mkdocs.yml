site_name: Jahk's Library of Possibility
site_description: A homebrew D&D wiki automatically synced from Google Drive.
site_author: Jahk

theme:
  name: material
  palette:
    # Light mode (default)
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs          # Places top-level folders in the top navigation bar
    - navigation.sections      # Groups items cleanly in the sidebar
    - navigation.top           # Adds a "Back to top" button when scrolling
    - navigation.expand        # Expands sidebar categories by default
    - navigation.indexes       # Allows folder main pages to act as category titles
    - search.suggest           # Live search suggestions
    - search.highlight         # Highlights searched words on the page
    - content.code.copy        # Adds copy buttons to code/stat blocks

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 1-3
