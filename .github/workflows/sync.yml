name: Sync Google Drive to Wiki Site

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants permission to push doc changes back to main
      pages: write          # Grants permission to deploy to GitHub Pages
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Pass token for push permissions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install -r requirements.txt

      - name: Run Drive Sync Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python sync_docs.py

      - name: Commit Updated Docs to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          git diff-index --quiet HEAD || git commit -m "Automated sync from Google Drive"
          git push

      - name: Build and Deploy Site via MkDocs
        run: mkdocs gh-deploy --force
